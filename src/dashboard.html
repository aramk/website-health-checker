<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Health Checker</title>
<style>
  :root { --bg: #0f1115; --card: #171b22; --border: #262c36; --text: #e8ecf1; --muted: #8b94a3; --up: #3fb96c; --down: #e5484d; --warn: #f5a524; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  #summary { color: var(--muted); font-size: 14px; }
  #summary .up { color: var(--up); font-weight: 600; }
  #summary .down { color: var(--down); font-weight: 600; }
  main { padding: 20px 28px; max-width: 1100px; }
  .add { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .add input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 9px 12px; font-size: 14px; }
  .add input[name="name"] { flex: 2; min-width: 150px; }
  .add input[name="url"] { flex: 3; min-width: 200px; }
  .add input[name="refreshSec"] { flex: 0 0 130px; }
  .add button { background: #2f6fed; border: none; border-radius: 6px; color: #fff; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .add button:hover { background: #2459c9; }
  #error { color: var(--down); font-size: 14px; margin-bottom: 12px; min-height: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.up { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .dot.down { background: var(--down); box-shadow: 0 0 8px var(--down); }
  .dot.unknown { background: var(--muted); }
  .card h2 { margin: 0; font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .url { color: var(--muted); font-size: 13px; margin: 6px 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .url a { color: inherit; text-decoration: none; }
  .card .url a:hover { text-decoration: underline; }
  .stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .good { color: var(--up); }
  .stats .bad { color: var(--down); }
  .spark { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-bottom: 10px; }
  .spark i { flex: 1; min-width: 3px; border-radius: 1px; background: var(--up); opacity: .85; }
  .spark i.down { background: var(--down); }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .del { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .del:hover { color: var(--down); border-color: var(--down); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .err-line { color: var(--down); font-size: 12px; margin-top: 6px; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>Website Health Checker</h1>
  <span id="summary"></span>
</header>
<main>
  <form class="add" id="addForm">
    <input name="name" id="name" placeholder="Name (e.g. My blog)" required maxlength="80">
    <input name="url" id="url" placeholder="https://example.com" required inputmode="url">
    <input name="refreshSec" id="refreshSec" type="number" min="0" step="any" placeholder="Every N sec (opt)">
    <button type="submit">Add site</button>
  </form>
  <div id="error"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const grid = document.getElementById('grid');
const summary = document.getElementById('summary');
const errorBox = document.getElementById('error');

function relTime(iso) {
  if (!iso) return 'never';
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 10) return 'just now';
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function fmtInterval(sec) {
  if (sec == null) return '—';
  if (sec < 60) return sec + 's';
  if (sec < 3600) { const m = sec / 60; return (Number.isInteger(m) ? m : m.toFixed(1)) + 'm'; }
  const h = sec / 3600; return (Number.isInteger(h) ? h : h.toFixed(1)) + 'h';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uptimeCell(v) {
  if (v == null) return '<b>—</b>';
  const cls = v >= 99 ? 'good' : v >= 95 ? '' : 'bad';
  return `<b class="${cls}">${v}%</b>`;
}

async function sparkline(siteId) {
  try {
    const r = await fetch(`/api/sites/${siteId}/checks?limit=30`);
    const { checks } = await r.json();
    const ordered = checks.slice().reverse();
    if (!ordered.length) return '<div class="spark"></div>';
    const bars = ordered.map(c => {
      const ms = (c.response_time_sec ?? 0) * 1000;
      const h = ms ? Math.min(26, 4 + Math.log10(ms + 1) * 8) : 6;
      return `<i class="${c.ok ? '' : 'down'}" style="height:${h.toFixed(0)}px" title="${esc(c.checked_at)}${c.status_code ? ' · ' + c.status_code : ''}${c.response_time_sec != null ? ' · ' + c.response_time_sec + 's' : ''}"></i>`;
    }).join('');
    return `<div class="spark">${bars}</div>`;
  } catch { return '<div class="spark"></div>'; }
}

let pollTimer = null;

/** Reload immediately, cancelling any pending scheduled poll. */
function refreshNow() {
  clearTimeout(pollTimer);
  load();
}

/** Refresh as often as the fastest site (or the global default when empty). Returns seconds. */
function nextPollSec(sites, defaultSec) {
  const base = sites.length
    ? Math.min(...sites.map((s) => s.refreshSec).filter((sec) => Number.isFinite(sec) && sec > 0))
    : defaultSec;
  return Math.max(Number.isFinite(base) && base > 0 ? base : 15, 5);
}

async function load() {
  let sites = [], defaultRefreshSec;
  try {
    const r = await fetch('/api/sites');
    if (!r.ok) throw new Error('API error ' + r.status);
    ({ sites, defaultRefreshSec } = await r.json());
    const up = sites.filter(s => s.latest && s.latest.ok).length;
    const down = sites.filter(s => s.latest && !s.latest.ok).length;
    const pending = sites.length - up - down;
    summary.innerHTML = sites.length
      ? `<span class="up">${up} up</span> · <span class="down">${down} down</span>${pending ? ` · ${pending} pending` : ''}`
      : 'no sites yet';

    if (!sites.length) {
      grid.innerHTML = '<div class="empty">Add your first site above — or list defaults in settings.json.</div>';
    } else {
    const cards = await Promise.all(sites.map(async (s) => {
      const dot = !s.latest ? 'unknown' : s.latest.ok ? 'up' : 'down';
      const status = !s.latest ? 'waiting for first check'
        : s.latest.ok ? `UP · ${s.latest.status_code}` : `DOWN${s.latest.status_code ? ' · ' + s.latest.status_code : ''}`;
      return `<div class="card" data-id="${s.id}">
        <div class="top"><span class="dot ${dot}"></span><h2 title="${esc(s.name)}">${esc(s.name)}</h2></div>
        <div class="url"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>
        <div class="stats">
          <span>Status <b>${esc(status)}</b></span>
          <span title="average of successful checks, last 24h">Avg latency <b>${s.avgLatencySec != null ? s.avgLatencySec + 's' : '—'}</b></span>
          <span>Every <b>${fmtInterval(s.refreshSec)}</b></span>
        </div>
        <div class="stats">
          <span>24h ${uptimeCell(s.uptime24h)}</span>
          <span>7d ${uptimeCell(s.uptime7d)}</span>
          <span>30d ${uptimeCell(s.uptime30d)}</span>
        </div>
        ${await sparkline(s.id)}
        <div class="foot">
          <span>checked ${relTime(s.latest?.checked_at)}</span>
          <button class="del" data-del="${s.id}">remove</button>
        </div>
        ${s.latest?.error ? `<div class="err-line">${esc(s.latest.error)}</div>` : ''}
      </div>`;
    }));
    grid.innerHTML = cards.join('');
    }
  } catch (e) {
    errorBox.textContent = 'Could not load sites: ' + e.message;
  }
  clearTimeout(pollTimer);
  pollTimer = setTimeout(load, nextPollSec(sites, defaultRefreshSec) * 1000);
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';
  const name = document.getElementById('name').value.trim();
  const url = document.getElementById('url').value.trim();
  const refreshSec = document.getElementById('refreshSec').value.trim();
  const body = { name, url };
  if (refreshSec !== '') body.refreshSec = Math.round(Number(refreshSec));
  try {
    const r = await fetch('/api/sites', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'request failed');
    document.getElementById('name').value = '';
    document.getElementById('url').value = '';
    document.getElementById('refreshSec').value = '';
    refreshNow();
  } catch (err) { errorBox.textContent = err.message; }
});

grid.addEventListener('click', async (e) => {
  const id = e.target?.dataset?.del;
  if (!id) return;
  if (!confirm('Stop monitoring this site? Its history will be deleted.')) return;
  await fetch('/api/sites/' + id, { method: 'DELETE' });
  refreshNow();
});

load();
</script>
</body>
</html>
